<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
<title>MediaForge</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
         background: #f5f2eb; color: #201f1c; }
  @media (prefers-color-scheme: dark) { body { background: #161615; color: #ede9e0; } p { color: #9a9488; } }
  .box { text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: #1d6b66; color: #fff; display: grid; place-items: center;
          font-weight: 650; font-size: 26px; margin: 0 auto 18px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.02em; }
  p { margin: 0; color: #6b665d; }
  .bar { width: 180px; height: 4px; border-radius: 4px; background: rgba(127,127,127,.25); margin: 22px auto 0; overflow: hidden; }
  .bar div { width: 40%; height: 100%; background: #2a7d76; border-radius: 4px; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">M</div>
    <h1>MediaForge</h1>
    <p>Starting… The first start can take a few minutes.</p>
    <div class="bar"><div></div></div>
  </div>
</body>
</html>
